/* ═══════════════════════════════════════
   M3 EXPRESSIVE — COLOR TOKENS
═══════════════════════════════════════ */
:root {
  /* Blue theme (default) */
  --seed: #38bdf8;
  --seed-rgb: 56,189,248;
  --primary: #A8D4F5;
  --on-primary: #003258;
  --primary-container: #00497D;
  --on-primary-container: #CEE5FF;
  --secondary: #B8C8D8;
  --secondary-container: #354A5A;
  --on-secondary-container: #D4E4F4;
  --tertiary: #D4B8E0;
  --tertiary-container: #4A3456;
  --error: #FFB4AB;
  --error-container: #93000A;
  --on-error: #fff;
  --surface: #0F1318;
  --surface-dim: #0F1318;
  --surface-bright: #353A40;
  --surface-container-lowest: #0A0F14;
  --surface-container-low: #171C22;
  --surface-container: #1B2128;
  --surface-container-high: #262C33;
  --surface-container-highest: #313840;
  --on-surface: #DEE3EA;
  --on-surface-variant: #BFC8D2;
  --outline: #899299;
  --outline-variant: #3F484F;
  --bg: #0F1318;
  --on-bg: #DEE3EA;
  --scrim: rgba(0,0,0,0.65);

  /* Motion */
  --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease-out: cubic-bezier(0.05, 0.7, 0.1, 1.0);
  --ease-in: cubic-bezier(0.3, 0.0, 0.8, 0.15);
  --standard: cubic-bezier(0.2, 0.0, 0, 1.0);
  --dur-short: 200ms;
  --dur-med: 350ms;
  --dur-long: 500ms;

  /* Shape */
  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 24px;
  --r-2xl: 28px;
  --r-full: 9999px;
}

  --primary: #FFB3AE; --on-primary: #680003;

/* ─── DAY MODE (light) ─── */
[data-mode="day"] {

  --outline-variant: #B0BEC8;
  --on-bg: #1A2230;
  --scrim: rgba(0,0,0,0.35);
}
[data-mode="day"][data-theme="blue"] {
  --primary: #0070B8; --on-primary: #FFFFFF;
  --primary-container: #B8DCFF; --on-primary-container: #00213A;

/* ═══════════════════════════════════════
   BASE
═══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
*:focus { outline: none !important; }

/* Disable text selection & zoom globally */
body, html {
  -webkit-user-select: none;
  -moz-user-select: none;
  user-select: none;
  touch-action: pan-x pan-y;
}
/* Allow copy only inside card boxes */
.card {
  -webkit-user-select: text;
  -moz-user-select: text;
  user-select: text;
}

body {
  font-family: 'Google Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--on-surface);
  min-height: 100dvh;
  overflow-x: hidden;
  transition: background var(--dur-long) var(--standard), color var(--dur-med) var(--standard);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeSpeed;
}

/* particles */
#particles-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.container { max-width: 860px; margin: 0 auto; padding: 0 16px 100px; position: relative; z-index: 1; }

/* ═══════════════════════════════════════
   RIPPLE
═══════════════════════════════════════ */
.ripple-surface { position: relative; overflow: hidden; }
.ripple-wave {
  position: absolute; border-radius: 50%;
  background: rgba(var(--seed-rgb), 0.22);
  transform: scale(0); animation: ripple-expand 550ms var(--ease-out) forwards;
  pointer-events: none;
}
@keyframes ripple-expand { to { transform: scale(4); opacity: 0; } }

/* ═══════════════════════════════════════
   SQUIGGLE
═══════════════════════════════════════ */
@keyframes squiggle {
  0%   { transform: scale(1) rotate(0deg); }
  20%  { transform: scale(1.08) rotate(-4deg); }
  40%  { transform: scale(1.06) rotate(4deg); }
  60%  { transform: scale(1.09) rotate(-3deg); }
  80%  { transform: scale(1.05) rotate(2deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.squiggle:active { animation: squiggle 420ms var(--spring); }

/* ═══════════════════════════════════════
   LOADING SCREEN (hidden by default)
═══════════════════════════════════════ */
#loadingScreen {
  display: none !important;
}
.m3-spinner {
  width: 48px; height: 48px;
  border: 4px solid var(--surface-container-highest);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 900ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loadingScreen p {
  color: var(--primary);
  font-size: 1rem; font-weight: 500; letter-spacing: 0.02em;
}

/* ═══════════════════════════════════════
   MATERIAL EXPRESSIVE DELETE DIALOG
═══════════════════════════════════════ */
.m3-dialog-scrim {
  position: fixed; inset: 0; z-index: 8000;
  background: var(--scrim);
  backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0 16px 24px;
  opacity: 0;
  transition: opacity var(--dur-med) var(--standard);
  pointer-events: none;
}
.m3-dialog-scrim.open {
  opacity: 1;
  pointer-events: auto;
}
.m3-dialog {
  width: 100%; max-width: 400px;
  background: var(--surface-container-highest);
  border: 1px solid var(--outline-variant);
  border-radius: var(--r-2xl);
  padding: 24px 24px 20px;
  box-shadow: 0 12px 48px rgba(0,0,0,0.7);
  transform: translateY(40px) scale(0.95);
  transition: transform var(--dur-med) var(--spring);
}
.m3-dialog-scrim.open .m3-dialog {
  transform: none;
}
.m3-dialog-icon {
  width: 48px; height: 48px;
  border-radius: var(--r-full);
  background: color-mix(in srgb, var(--error) 15%, transparent);
  border: 1.5px solid color-mix(in srgb, var(--error) 35%, transparent);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
}
.m3-dialog-icon .material-icons-round { color: var(--error); font-size: 1.4rem; }
.m3-dialog-title {
  font-family: 'Google Sans Display', sans-serif;
  font-size: 1.2rem; font-weight: 700;
  color: var(--on-surface);
  margin-bottom: 8px;
}
.m3-dialog-body {
  font-size: 0.9rem; color: var(--on-surface-variant);
  line-height: 1.55; margin-bottom: 24px;
}
.m3-dialog-body strong { color: var(--on-surface); font-weight: 600; }
.m3-dialog-actions {
  display: flex; gap: 10px; justify-content: flex-end;
}
.m3-dialog-btn {
  padding: 10px 20px;
  border-radius: var(--r-full);
  border: none; cursor: pointer;
  font-family: 'Google Sans', sans-serif;
  font-size: 0.9rem; font-weight: 600;
  transition: all var(--dur-short) var(--standard);
  display: flex; align-items: center; gap: 6px;
}
.m3-dialog-btn .material-icons-round { font-size: 1rem; }
.m3-dialog-btn-cancel {
  background: var(--surface-container-high);
  color: var(--on-surface-variant);
  border: 1px solid var(--outline-variant);
}
.m3-dialog-btn-cancel:hover { background: var(--surface-container-highest); }
.m3-dialog-btn-delete {
  background: var(--error-container, #93000A);
  color: var(--error);
  border: 1px solid color-mix(in srgb, var(--error) 30%, transparent);
}
.m3-dialog-btn-delete:hover { filter: brightness(1.2); }

/* TOP APP BAR — hidden/removed */
.top-bar { display: none !important; }

/* ═══════════════════════════════════════
   ICON BUTTON
═══════════════════════════════════════ */
.icon-btn {
  width: 48px; height: 48px;
  border-radius: var(--r-full);
  border: none; background: transparent;
  color: var(--on-surface-variant);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.5rem;
  transition: background var(--dur-short) var(--standard);
}
.icon-btn:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
.icon-btn .material-icons-round { font-size: 1.375rem; }

/* ═══════════════════════════════════════
   HERO / HEADER CARD
═══════════════════════════════════════ */
.hero-card {
  background: linear-gradient(135deg, var(--primary-container), var(--tertiary-container, #4A3456));
  border-radius: var(--r-2xl);
  padding: 20px;
  margin: 16px 0;
  border: 1px solid color-mix(in srgb, var(--primary) 20%, transparent);
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  animation: springUp var(--dur-long) var(--spring) both;
}
@keyframes springUp {
  from { opacity: 0; transform: translateY(24px) scale(0.96); }
  to   { opacity: 1; transform: none; }
}
.hero-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.hero-title {
  font-family: 'Google Sans Display', sans-serif;
  font-size: 1.6rem; font-weight: 700;
  color: var(--on-primary-container);
  display: flex; align-items: center; gap: 8px;
}
.live-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 0 3px rgba(74,222,128,0.25);
  animation: pulse-live 2s ease-in-out infinite;
}
@keyframes pulse-live {
  0%,100% { box-shadow: 0 0 0 3px rgba(74,222,128,0.25); }
  50%      { box-shadow: 0 0 0 8px rgba(74,222,128,0.08); }
}

/* ─── Theme Dots ─── */
.theme-row { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.25); padding: 6px 10px; border-radius: var(--r-full); border: 1px solid rgba(255,255,255,0.08); }
.theme-dot {
  width: 18px; height: 18px; border-radius: 50%;
  cursor: pointer; border: 2px solid transparent;
  transition: transform 300ms var(--spring), border-color 200ms;
}
.theme-dot:hover { transform: scale(1.3); }
.theme-dot.active { border-color: white; transform: scale(1.25); box-shadow: 0 0 0 2px rgba(255,255,255,0.3); }
.theme-dot[data-color="blue"]     { background: #38bdf8; }
.theme-dot[data-color="red"]      { background: #ef4444; }
.theme-dot[data-color="pink"]     { background: #ec4899; }
.theme-dot[data-color="green"]    { background: #10b981; }
.theme-dot[data-color="orange"]   { background: #f97316; }
.theme-dot[data-color="purple"]   { background: #a855f7; }
.theme-dot[data-color="yellow"]   { background: #eab308; }
.theme-dot[data-color="cyan"]     { background: #06b6d4; }
.theme-dot[data-color="rosegold"] { background: linear-gradient(135deg, #e8927c, #f4c2a8); }
.theme-dot[data-color="mint"]     { background: #34d399; }
.theme-dot[data-color="indigo"]   { background: #6366f1; }
.theme-dot[data-color="amber"]    { background: #f59e0b; }

/* ─── Theme Popup ─── */
#themePopup {
  position: absolute; right: 0; top: calc(100% + 10px);
  background: var(--surface-container-highest);
  border: 1px solid var(--outline-variant);
  border-radius: var(--r-xl);
  padding: 14px;
  display: flex; flex-wrap: wrap; gap: 10px;
  z-index: 200;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  backdrop-filter: blur(16px);
  opacity: 0; transform: scale(0.9) translateY(-6px);
  transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out);
  pointer-events: none;
  width: 192px;
}
#themePopup.open {
  opacity: 1; transform: none;
  pointer-events: auto;
}

/* ─── Day/Night Toggle ─── */
.day-night-btn {
  width: 40px; height: 40px;
  border-radius: var(--r-full);
  border: 1.5px solid rgba(255,255,255,0.15);
  background: rgba(0,0,0,0.25);
  color: var(--on-primary-container);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 250ms var(--spring);
  flex-shrink: 0;
  backdrop-filter: blur(8px);
}
.day-night-btn:hover { transform: scale(1.12); background: rgba(0,0,0,0.4); }
.day-night-btn .material-icons-round { font-size: 1.1rem; }

/* ─── Refresh Button (hero) ─── */
.refresh-hero-btn {
  width: 40px; height: 40px;
  border-radius: var(--r-full);
  border: 1.5px solid rgba(255,255,255,0.15);
  background: rgba(0,0,0,0.25);
  color: var(--on-primary-container);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 250ms var(--spring);
  flex-shrink: 0;
  backdrop-filter: blur(8px);
}
.refresh-hero-btn:hover { transform: scale(1.12) rotate(180deg); background: rgba(0,0,0,0.4); }
.refresh-hero-btn .material-icons-round { font-size: 1.15rem; }

/* ─── Color Palette Button (M3 Tonal Icon Button) ─── */
.palette-btn {
  width: 40px; height: 40px;
  border-radius: var(--r-full);
  border: none;
  background: rgba(0,0,0,0.22);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 280ms var(--spring);
  position: relative;
  flex-shrink: 0;
  overflow: hidden;
  backdrop-filter: blur(8px);
}
/* Spinning rainbow ring */
.palette-btn::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: var(--r-full);
  background: conic-gradient(
    #ef4444 0deg,
    #f97316 45deg,
    #eab308 90deg,
    #10b981 135deg,
    #38bdf8 180deg,
    #a855f7 225deg,
    #ec4899 270deg,
    #ef4444 360deg
  );
  z-index: 0;
  transition: transform 600ms var(--ease-out);
}
.palette-btn::after {
  content: '';
  position: absolute;
  inset: 2px;
  border-radius: var(--r-full);
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
  z-index: 1;
}
.palette-btn .palette-icon {
  position: relative; z-index: 2;
  font-size: 1.05rem;
  color: #fff;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.6));
  transition: transform 350ms var(--spring);
}
.palette-btn:hover::before { transform: rotate(180deg); }
.palette-btn:hover .palette-icon { transform: rotate(-20deg) scale(1.15); }
.palette-btn:active { transform: scale(0.92); }
.palette-btn-wrap { position: relative; }

/* ─── Profile Chip ─── */
.profile-chip {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: var(--r-full);
  padding: 6px 14px 6px 6px;
}
.profile-chip img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
.profile-chip span { font-size: 0.875rem; font-weight: 600; color: var(--on-primary-container); }

/* ─── Logout Button ─── */
.btn-logout {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 18px;
  border-radius: var(--r-full);
  border: 1.5px solid var(--error);
  background: rgba(255,180,171,0.07);
  color: var(--error);
  font-family: 'Google Sans', sans-serif;
  font-size: 0.875rem; font-weight: 600;
  cursor: pointer;
  transition: all var(--dur-short) var(--standard);
}
.btn-logout:hover { background: rgba(255,180,171,0.15); }
.btn-logout .material-icons-round { font-size: 1rem; }

/* ═══════════════════════════════════════
   SEGMENTED TABS
═══════════════════════════════════════ */
.tabs-row {
  display: flex; gap: 8px;
  padding: 4px;
  background: var(--surface-container-high);
  border-radius: var(--r-full);
  border: 1px solid var(--outline-variant);
  margin-bottom: 16px;
}
.tab-btn {
  flex: 1;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px;
  border-radius: var(--r-full);
  border: none; background: transparent;
  color: var(--on-surface-variant);
  font-family: 'Google Sans', sans-serif;
  font-size: 0.9375rem; font-weight: 500;
  cursor: pointer;
  transition: all var(--dur-med) var(--ease-out);
}
.tab-btn .material-icons-round { font-size: 1.1rem; }
.tab-btn.active {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: 0 2px 8px rgba(0,0,0,0.35);
}
@keyframes tab-pop {
  from { transform: scale(0.92); }
  to   { transform: scale(1); }
}
.tab-btn.active { animation: tab-pop var(--dur-short) var(--spring); }

/* ═══════════════════════════════════════
   SEARCH BAR
═══════════════════════════════════════ */
.search-wrap {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface-container-high);
  border: 1.5px solid var(--outline-variant);
  border-radius: var(--r-full);
  padding: 12px 18px;
  margin-bottom: 16px;
  transition: border-color var(--dur-short) var(--standard),
              box-shadow var(--dur-short) var(--standard);
}
.search-wrap:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(var(--seed-rgb), 0.18);
}
.search-wrap .material-icons-round { color: var(--on-surface-variant); font-size: 1.2rem; flex-shrink: 0; }
.search-wrap input {
  flex: 1; border: none; background: transparent; outline: none;
  color: var(--on-surface);
  font-family: 'Google Sans', sans-serif; font-size: 1rem;
}
.search-wrap input::placeholder { color: var(--on-surface-variant); }
.total-badge {
  background: var(--secondary-container);
  color: var(--on-secondary-container, var(--on-surface-variant));
  font-size: 0.75rem; font-weight: 600;
  padding: 4px 12px; border-radius: var(--r-full);
  white-space: nowrap; flex-shrink: 0;
}

/* ═══════════════════════════════════════
   APP CARDS
═══════════════════════════════════════ */
.cards-grid { display: grid; gap: 12px; }

.card {
  background: var(--surface-container);
  border: 1px solid var(--outline-variant);
  border-radius: var(--r-2xl);
  padding: 18px 18px 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  animation: card-in var(--dur-med) var(--ease-out) both;
  transition: transform var(--dur-short) var(--standard),
              box-shadow var(--dur-short) var(--standard),
              border-color var(--dur-short) var(--standard);
  position: relative;
  overflow: hidden;
}
/* Thin accent line on left side */
.card::before {
  content: '';
  position: absolute;
  left: 0; top: 16px; bottom: 16px;
  width: 3px;
  border-radius: 0 var(--r-full) var(--r-full) 0;
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--primary) 80%, transparent),
    color-mix(in srgb, var(--primary) 20%, transparent)
  );
  opacity: 0.7;
  transition: opacity var(--dur-short) var(--standard),
              height var(--dur-short) var(--standard);
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  border-color: color-mix(in srgb, var(--primary) 35%, var(--outline-variant));
}
.card:hover::before { opacity: 1; }
@keyframes card-in {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: none; }
}
@keyframes card-out {
  to { opacity: 0; transform: scale(0.86); }
}
.deleting { animation: card-out 380ms var(--spring) forwards !important; pointer-events: none; }

.card-title {
  font-family: 'Google Sans Display', sans-serif;
  font-size: 1.05rem; font-weight: 700;
  color: var(--on-surface);
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 14px; word-break: break-all;
}
.card-title .material-icons-round { color: var(--primary); font-size: 1.1rem; flex-shrink: 0; }
.card-serial {
  font-size: 0.7rem; font-weight: 700;
  color: var(--on-primary);
  background: var(--primary);
  border-radius: var(--r-xs);
  padding: 2px 6px;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}

/* ─── Card Action Buttons ─── */
.card-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }

.action-btn {
  flex: 1; min-width: 0;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  padding: 9px 10px;
  border-radius: var(--r-xl);
  border: 1.5px solid var(--outline-variant);
  background: var(--surface-container-high);
  color: var(--on-surface);
  font-family: 'Google Sans', sans-serif;
  font-size: 0.8125rem; font-weight: 600;
  cursor: pointer;
  transition: all var(--dur-short) var(--standard);
  white-space: nowrap;
}
.action-btn .material-icons-round { font-size: 0.9rem; }
.action-btn:hover { background: var(--surface-container-highest); transform: translateY(-1px); }

.btn-visit  { border-color: color-mix(in srgb, var(--primary) 40%, transparent); color: var(--primary); }
.btn-visit:hover  { background: color-mix(in srgb, var(--primary) 12%, var(--surface-container-high)); }

.btn-edit   { border-color: color-mix(in srgb, #D4B8E0 40%, transparent); color: #D4B8E0; }
.btn-edit:hover   { background: rgba(212,184,224,0.1); }

.btn-copy   { border-color: color-mix(in srgb, #6CDBAE 40%, transparent); color: #6CDBAE; }
.btn-copy:hover   { background: rgba(108,219,174,0.1); }

.btn-delete { border-color: color-mix(in srgb, var(--error) 40%, transparent); color: var(--error); }
.btn-delete:hover { background: rgba(255,180,171,0.1); }

/* card meta */
.card-meta {
  display: flex; gap: 14px; flex-wrap: wrap;
  padding-top: 12px;
  border-top: 1px solid var(--outline-variant);
}
.meta-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 0.75rem; color: var(--on-surface-variant); font-weight: 500;
}
.meta-item .material-icons-round { font-size: 0.9375rem; color: var(--outline); }

/* empty state */
.empty-state {
  text-align: center; padding: 56px 24px;
  color: var(--on-surface-variant);
  animation: card-in var(--dur-med) var(--ease-out) both;
}
.empty-state .material-icons-round { font-size: 4rem; opacity: 0.25; display: block; margin-bottom: 12px; }

/* ═══════════════════════════════════════
   EDITOR
═══════════════════════════════════════ */
.editor-card {
  background: var(--surface-container);
  border: 1px solid var(--outline-variant);
  border-radius: var(--r-2xl);
  padding: 24px 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  animation: card-in var(--dur-med) var(--ease-out) both;
}
.editor-card h2 {
  font-family: 'Google Sans Display', sans-serif;
  font-size: 1.3rem; font-weight: 700;
  color: var(--on-surface);
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 22px;
}
.editor-card h2 .material-icons-round { color: var(--primary); }

.field-group { margin-bottom: 18px; }
.field-label {
  display: block;
  font-size: 0.8rem; font-weight: 600;
  color: var(--primary);
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: 8px;
}
.m3-input {
  width: 100%; padding: 14px 16px;
  background: var(--surface-container-high);
  border: 1.5px solid var(--outline-variant);
  border-radius: var(--r-xl);
  color: var(--on-surface);
  font-family: 'Google Sans', sans-serif; font-size: 1rem;
  outline: none;
  transition: border-color var(--dur-short) var(--standard),
              box-shadow var(--dur-short) var(--standard),
              background var(--dur-short) var(--standard);
}
.m3-input::placeholder { color: var(--on-surface-variant); }
.m3-input:focus {
  border-color: var(--primary);
  background: var(--surface-container-highest);
  box-shadow: 0 0 0 3px rgba(var(--seed-rgb), 0.18);
}
.m3-input:disabled {
  opacity: 0.5; cursor: not-allowed;
  border-style: dashed;
}
.m3-textarea {
  min-height: 200px; resize: none; overflow: hidden;
  font-family: 'Google Sans', monospace; font-size: 0.95rem;
  line-height: 1.55;
  border-radius: var(--r-xl);
}

/* ─── Filled Button (Save/Login) ─── */
.btn-filled {
  width: 100%; padding: 15px 24px;
  border-radius: var(--r-full);
  border: none;
  background: var(--primary);
  color: var(--on-primary);
  font-family: 'Google Sans', sans-serif;
  font-size: 1rem; font-weight: 700;
  letter-spacing: 0.01em;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.4);
  transition: all var(--dur-short) var(--standard);
  margin-top: 6px;
}
.btn-filled:hover { filter: brightness(1.1); box-shadow: 0 6px 20px rgba(0,0,0,0.45); }
.btn-filled .material-icons-round { font-size: 1.1rem; }

/* ═══════════════════════════════════════
   LOGIN CARD
═══════════════════════════════════════ */
#loginSection {
  max-width: 400px; margin: 14vh auto 0;
  padding: 36px 28px 28px;
  background: var(--surface-container);
  border: 1px solid var(--outline-variant);
  border-radius: var(--r-2xl);
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  text-align: center;
  animation: springUp var(--dur-long) var(--spring) both;
}
#loginSection h2 {
  font-family: 'Google Sans Display', sans-serif;
  font-size: 1.75rem; font-weight: 700;
  color: var(--on-surface);
  margin-bottom: 28px;
}
.login-fields { display: flex; flex-direction: column; gap: 12px; margin-bottom: 8px; }

/* ═══════════════════════════════════════
   FAB
═══════════════════════════════════════ */
.fab {
  position: fixed; bottom: 24px; right: 20px;
  width: 64px; height: 64px;
  border-radius: var(--r-xl);
  border: none;
  background: var(--primary);
  color: var(--on-primary);
  font-size: 1.75rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 24px rgba(0,0,0,0.55),
              0 0 0 1px color-mix(in srgb, var(--primary) 40%, transparent);
  z-index: 50;
  transition: all var(--dur-med) var(--ease-out);
  transform-origin: bottom right;
}
.fab:hover { transform: scale(1.1) translateY(-2px); box-shadow: 0 10px 32px rgba(0,0,0,0.6); }
.fab .material-icons-round { font-size: 1.75rem; }
.fab.fab-hidden {
  transform: scale(0) translateY(20px);
  opacity: 0;
  pointer-events: none;
}

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
#toastContainer {
  position: fixed; bottom: 100px; left: 0; right: 0;
  display: flex; flex-direction: column; align-items: center;
  gap: 10px; z-index: 10000; pointer-events: none;
  padding: 0 20px;
}
.toast {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface-container-highest);
  border: 1px solid var(--outline-variant);
  color: var(--on-surface);
  padding: 12px 22px;
  border-radius: var(--r-full);
  font-size: 0.9rem; font-weight: 500;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
  animation: toast-in var(--dur-med) var(--spring) both;
  max-width: calc(100vw - 40px);
}
.toast .material-icons-round { font-size: 1.1rem; }
.toast.success { border-color: #4ade80; color: #86efac; }
.toast.success .material-icons-round { color: #4ade80; }
.toast.error   { border-color: var(--error); color: #FFB4AB; }
.toast.error .material-icons-round { color: var(--error); }
@keyframes toast-in  { from { opacity: 0; transform: translateY(20px) scale(0.88); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to   { opacity: 0; transform: translateY(12px) scale(0.88); } }
.toast.leaving { animation: toast-out var(--dur-short) var(--ease-in) forwards; }

/* ═══════════════════════════════════════
   SHAKE ANIMATION (error)
═══════════════════════════════════════ */
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%  { transform: translateX(-8px); }
  40%  { transform: translateX(8px); }
  60%  { transform: translateX(-5px); }
  80%  { transform: translateX(4px); }
}
.error-shake { animation: shake 0.42s ease-in-out; box-shadow: 0 0 0 3px rgba(255,180,171,0.25) !important; }

/* ═══════════════════════════════════════
   PULL TO REFRESH
═══════════════════════════════════════ */
#ptr-indicator {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  height: 0; overflow: hidden;
  color: var(--primary);
  font-size: 0.875rem; font-weight: 500;
  transition: height 200ms var(--ease-out);
}
#ptr-indicator.pulling { height: 48px; }
#ptr-indicator.refreshing { height: 48px; }
#ptr-indicator .ptr-icon {
  font-size: 1.2rem;
  transition: transform 300ms var(--ease-out);
}
#ptr-indicator.pulling .ptr-icon { transform: rotate(180deg); }
#ptr-indicator.refreshing .ptr-icon { animation: spin 700ms linear infinite; }

.hidden { display: none !important; }
@media (max-width: 520px) {
  .container { padding: 0 12px 100px; }
  .tab-btn { font-size: 0.875rem; padding: 10px 10px; }
}
</style>
</head>
<body data-theme="blue">

<canvas id="particles-bg"></canvas>
<div id="toastContainer"></div>


<div id="ptr-indicator">
  <span class="material-icons-round ptr-icon">refresh</span>
  <span id="ptr-text">Pull to refresh</span>
</div>

<div class="container">

  <!-- ══ LOGIN ══ -->
  <div id="loginSection" class="hidden ripple-surface">
    <h2>Admin Access</h2>
    <div class="login-fields">
      <input class="m3-input" type="email" id="email" placeholder="Email" autocomplete="email">
      <input class="m3-input" type="password" id="password" placeholder="Password" autocomplete="current-password">
    </div>
    <button class="btn-filled squiggle ripple-surface" id="loginBtn">
      <span class="material-icons-round">lock</span> Secure Login
    </button>
    <p id="loginErr" style="margin-top:12px;font-size:0.8rem;color:var(--error);min-height:18px;"></p>
  </div>

  <!-- ══ APP SECTION ══ -->
  <div id="appSection" class="hidden">

    <!-- HERO CARD -->
    <div class="hero-card">
      <div class="hero-row" style="margin-bottom:14px">
        <div class="hero-title">
          Paste Manager <div class="live-dot"></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <!-- Refresh -->
          <button class="refresh-hero-btn ripple-surface squiggle" onclick="refreshApps()" title="Refresh">
            <span class="material-icons-round">refresh</span>
          </button>
          <!-- Day/Night Toggle -->
          <button class="day-night-btn ripple-surface squiggle" id="dayNightBtn" title="Toggle Day/Night">
            <span class="material-icons-round" id="dayNightIcon">dark_mode</span>
          </button>
          <!-- Color Theme Picker -->
          <div class="palette-btn-wrap">
            <button class="palette-btn ripple-surface squiggle" id="paletteBtn" title="Change Color Theme">
              <span class="material-icons-round palette-icon">palette</span>
            </button>
            <div id="themePopup">
              <span class="theme-dot active" data-color="blue" title="Blue"></span>
              <span class="theme-dot" data-color="red" title="Red"></span>
              <span class="theme-dot" data-color="pink" title="Pink"></span>
              <span class="theme-dot" data-color="green" title="Green"></span>
              <span class="theme-dot" data-color="orange" title="Orange"></span>
              <span class="theme-dot" data-color="purple" title="Purple"></span>
              <span class="theme-dot" data-color="yellow" title="Yellow"></span>
              <span class="theme-dot" data-color="cyan" title="Cyan"></span>
              <span class="theme-dot" data-color="rosegold" title="Rose Gold"></span>
              <span class="theme-dot" data-color="mint" title="Mint"></span>
              <span class="theme-dot" data-color="indigo" title="Indigo"></span>
              <span class="theme-dot" data-color="amber" title="Amber"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="hero-row">
        <div class="profile-chip">
          <img src="profile.png" alt="Profile" id="profileImg"
               onerror="this.src='https://ui-avatars.com/api/?name=ANiK&background=1B2128&color=A8D4F5&bold=true&size=64'">
          <span id="userEmailBadge">ANiK555</span>
        </div>
        <button class="btn-logout squiggle ripple-surface" id="logoutBtn">
          <span class="material-icons-round">logout</span> Logout
        </button>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs-row">
      <button class="tab-btn active ripple-surface" id="tabMyPastes">
        <span class="material-icons-round">content_paste</span> My Paste's
      </button>
      <button class="tab-btn ripple-surface" id="tabCreate">
        <span class="material-icons-round">edit_note</span> Editor
      </button>
    </div>

    <!-- LIST VIEW -->
    <div id="viewList">
      <div class="search-wrap">
        <span class="material-icons-round">search</span>
        <input type="search" id="searchInput" placeholder="Search pastes...">
        <span class="total-badge" id="totalCount">Total: 0</span>
      </div>

/* ════════════════════════════════

function attachRipple(el) {
  if (el.dataset.ripple) return;
  el.dataset.ripple = '1';
  el.addEventListener('pointerdown', e => {
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 2.2;
    const r = document.createElement('div');
    r.className = 'ripple-wave';
    r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size/2}px;top:${e.clientY - rect.top - size/2}px`;
    el.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  });
}
function attachAllRipples() {
  document.querySelectorAll('.ripple-surface').forEach(attachRipple);
}

}

/* ════════════════════════════════
   PARTICLES
════════════════════════════════ */
const canvas = document.getElementById('particles-bg');
const ctx    = canvas.getContext('2d');
let particles = [], pColor = 'rgba(56,189,248,0.4)';

function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resizeCanvas); resizeCanvas();

function updateParticleColor(t) {
  const map = {
    blue:'rgba(56,189,248,0.4)', red:'rgba(239,68,68,0.4)',
    pink:'rgba(236,72,153,0.4)', green:'rgba(16,185,129,0.4)',
    orange:'rgba(249,115,22,0.4)', purple:'rgba(168,85,247,0.4)',
    yellow:'rgba(234,179,8,0.4)', cyan:'rgba(6,182,212,0.4)',
    rosegold:'rgba(232,146,124,0.4)', mint:'rgba(52,211,153,0.4)',
    indigo:'rgba(99,102,241,0.4)', amber:'rgba(245,158,11,0.4)'
  };
  pColor = map[t] || map.blue;
}
updateParticleColor(savedTheme);

class Particle {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * canvas.width;
    this.y = init ? Math.random() * canvas.height : canvas.height;
    this.size   = Math.random() * 2 + 0.5;
    this.speedY = -(Math.random() * 0.5 + 0.1);
    this.speedX = (Math.random() - 0.5) * 0.5;
  }
  update() {
    this.x += this.speedX; this.y += this.speedY;
    if (this.y < 0) this.reset(false);
  }
  draw() { ctx.fillStyle = pColor; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
}
function initParticles() { particles = []; for (let i = 0; i < Math.min(innerWidth/10, 80); i++) particles.push(new Particle()); }
initParticles();
(function loop() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(loop); })();

/* ════════════════════════════════
   LOAD & RENDER
════════════════════════════════ */
function loadMetadata() {
  if (!currentUserUid) return;
  const metaRef = ref(db, 'api_metadata/' + currentUserUid);
  onValue(metaRef, snap => {
    currentApps = snap.val() || {};
    renderCards(currentApps);
  });
}

window.refreshApps = function() {
  loadMetadata();
  showToast("Refreshed!", "success");
};

function renderCards(data) {
  cardsGrid.innerHTML = '';
  const keys = Object.keys(data);
  totalCount.textContent = `Total: ${keys.length}`;
  // Sort by date ascending for serial numbering (oldest = 01)
  const sortedAsc = [...keys].sort((a, b) => new Date(data[a].updatedAt) - new Date(data[b].updatedAt));
  const serialMap = {};
  sortedAsc.forEach((k, i) => { serialMap[k] = String(i + 1).padStart(2, '0'); });
  // Display newest first
  keys.sort((a, b) => new Date(data[b].updatedAt) - new Date(data[a].updatedAt));

  if (keys.length === 0) {
    cardsGrid.innerHTML = `<div class="empty-state">
      <span class="material-icons-round">inbox</span>
      <p>No pastes yet. Tap + to add one.</p>
    </div>`;
    return;
  }

  const dbUrl = firebaseConfig.databaseURL.replace(/\/$/, '');
  keys.forEach((key, idx) => {
    const item   = data[key];
    const rawUrl = `${dbUrl}/api_data/${currentUserUid}/${encodeURIComponent(key)}.json`;
    const dateStr = (item.updatedAt || '').split(',')[0] || '—';
    const chars   = item.chars || 0;
    const views   = item.views || 0;
    const serial  = serialMap[key];

    const card = document.createElement('div');
    card.className = 'card ripple-surface';
    card.style.animationDelay = `${idx * 45}ms`;
    card.innerHTML = `
      <div class="card-title">
        <span class="card-serial">${serial}</span>
        <span class="material-icons-round">content_paste</span>${escHtml(key)}
      </div>
      <div class="card-actions">
        <button class="action-btn btn-visit squiggle ripple-surface" data-url="${rawUrl}">
          <span class="material-icons-round">open_in_new</span> Visit
        </button>
        <button class="action-btn btn-edit squiggle ripple-surface" data-id="${escHtml(key)}">
          <span class="material-icons-round">edit</span> Edit
        </button>
        <button class="action-btn btn-copy squiggle ripple-surface" data-url="${rawUrl}">
          <span class="material-icons-round">content_copy</span> Copy
        </button>
        <button class="action-btn btn-delete squiggle ripple-surface" data-id="${escHtml(key)}">
          <span class="material-icons-round">delete</span> Delete
        </button>
      </div>
      <div class="card-meta">
        <span class="meta-item"><span class="material-icons-round">calendar_month</span>${dateStr}</span>
        <span class="meta-item"><span class="material-icons-round">description</span>${chars} chars</span>
        <span class="meta-item"><span class="material-icons-round">visibility</span>${views} views</span>
      </div>`;
    cardsGrid.appendChild(card);
  });

  attachCardListeners();
  attachAllRipples();
}

function attachCardListeners() {
  /* Visit */
  document.querySelectorAll('.btn-visit').forEach(btn => {
    btn.addEventListener('click', e => window.open(e.currentTarget.dataset.url, '_blank'));
  });

  /* Copy */
  document.querySelectorAll('.btn-copy').forEach(btn => {
    btn.addEventListener('click', e => {
      const b = e.currentTarget;
      navigator.clipboard.writeText(b.dataset.url);
      showToast("Raw Link Copied!", "success");
      const orig = b.innerHTML;
      b.innerHTML = `<span class="material-icons-round">done</span> Copied!`;
      b.style.borderColor = 'var(--primary)'; b.style.color = 'var(--primary)';
      setTimeout(() => { b.innerHTML = orig; b.style.borderColor = ''; b.style.color = ''; attachAllRipples(); }, 2000);
    });
  });

  /* Delete */
  document.querySelectorAll('.btn-delete').forEach(btn => {
    btn.addEventListener('click', e => {
      const id   = e.currentTarget.dataset.id;
      const card = e.currentTarget.closest('.card');
      showDeleteDialog(id, card);
    });

  /* Edit */
  document.querySelectorAll('.btn-edit').forEach(btn => {
    btn.addEventListener('click', e => {
      const id = e.currentTarget.dataset.id;
      editorTitle.innerHTML = `<span class="material-icons-round">edit</span> Editing: ${escHtml(id)}`;
      saveBtnText.textContent = "Update Database";
      saveBtn.querySelector('.material-icons-round').textContent = 'cloud_done';
      appNameInput.value    = id;
      appNameInput.disabled = true;
      jsonInputArea.value   = "Fetching data...";
      switchTab('editor');
      get(ref(db, `api_data/${currentUserUid}/${id}`)).then(snap => {
        if (snap.exists()) {
          const d = snap.val();
          jsonInputArea.value = (typeof d === 'object' && d !== null) ? JSON.stringify(d, null, 2) : d;
          setTimeout(autoResize, 50);
        }
      });
    });
  });
}

/* ════════════════════════════════
   SAVE
════════════════════════════════ */
saveBtn.addEventListener('click', () => {
  let appName     = appNameInput.value.trim();
  const rawJson   = jsonInputArea.value;
  const isEdit    = appNameInput.disabled;

  if (!appName) { showToast("App Name is required", "error"); return triggerErrorShake(appNameInput); }

  const safeName = appName.replace(/[.#$\[\]]/g, '-').replace(/\s+/g, '-');
  if (appName !== safeName && !isEdit) {
    appNameInput.value = safeName; appName = safeName;
    showToast("Special chars auto-formatted to dashes!", "success");
  }

  let payload;
  try   { payload = JSON.parse(rawJson); }
  catch { payload = rawJson; }

  const charCount = rawJson.length;
  saveBtnText.textContent = isEdit ? "Updating..." : "Adding...";

  const currentDate = new Date().toLocaleString('en-IN', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  const upd = {};
  upd[`api_data/${currentUserUid}/${appName}`]              = payload;
  upd[`api_metadata/${currentUserUid}/${appName}/updatedAt`]= currentDate;
  upd[`api_metadata/${currentUserUid}/${appName}/chars`]    = charCount;

  get(ref(db, `api_metadata/${currentUserUid}/${appName}/views`)).then(snap => {
    if (!snap.exists()) upd[`api_metadata/${currentUserUid}/${appName}/views`] = 0;
    update(ref(db), upd).then(() => {
      showToast(isEdit ? "Database Updated!" : "Added to Database!", "success");
      saveBtnText.textContent = isEdit ? "Update Database" : "Add to Database";
      appNameInput.disabled = false;
      switchTab('list');
    }).catch(err => {
      showToast("Database Error", "error");
      saveBtnText.textContent = isEdit ? "Update Database" : "Add to Database";
    });
  });
});

const deleteDialog      = document.getElementById('deleteDialog');
const deleteDialogName  = document.getElementById('deleteDialogName');
const deleteCancelBtn   = document.getElementById('deleteCancelBtn');
const deleteConfirmBtn  = document.getElementById('deleteConfirmBtn');
let pendingDeleteId   = null;

function showDeleteDialog(id, card) {

  pendingDeleteCard = card;
  deleteDialogName.textContent = id;

  if (e.target === deleteDialog) hideDeleteDialog();

  const id   = pendingDeleteId;
  const card = pendingDeleteCard;

      .then(() => showToast(`Deleted: ${id}`, 'success'))
      .catch(err => showToast('Error: ' + err.message, 'error'));

});

});

/* ════════════════════════════════
   PULL TO REFRESH
════════════════════════════════ */
(function() {
  const ptrEl   = document.getElementById('ptr-indicator');
  const ptrText = document.getElementById('ptr-text');
  let startY = 0, pulling = false, triggered = false;
  const THRESHOLD = 72;

  document.addEventListener('touchstart', e => {
    if (window.scrollY === 0) { startY = e.touches[0].clientY; pulling = true; triggered = false; }
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0 && window.scrollY === 0) {
      const progress = Math.min(dy / THRESHOLD, 1);
      if (progress > 0.1) {
        ptrEl.classList.add('pulling');
        ptrText.textContent = dy >= THRESHOLD ? 'Release to refresh' : 'Pull to refresh';
      }
      if (dy >= THRESHOLD && !triggered) triggered = true;
    }
  }, { passive: true });

  document.addEventListener('touchend', () => {
    if (!pulling) return;
    pulling = false;
    if (triggered) {
      ptrEl.classList.remove('pulling');
      ptrEl.classList.add('refreshing');
      ptrText.textContent = 'Refreshing...';
      setTimeout(() => {
        window.refreshApps();
        ptrEl.classList.remove('refreshing');
        ptrText.textContent = 'Pull to refresh';
      }, 900);
    } else {
      ptrEl.classList.remove('pulling');
    }
    triggered = false;
  });
})();
